name: Release

# A new version number in manifest.json makes a new release, with its notes taken from CHANGELOG.md.
on:
  push:
    branches: [main]
    paths:
      - custom_components/athom_hub/manifest.json
      - CHANGELOG.md
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Tests
        run: |
          pip install pytest
          python -m pytest -q tests

      - name: Version
        id: v
        run: echo "version=$(python -c "import json;print(json.load(open('custom_components/athom_hub/manifest.json'))['version'])")" >> "$GITHUB_OUTPUT"

      - name: Release (only if this version is new)
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "v$V is already released."
            exit 0
          fi
          python .github/scripts/release_notes.py "$V" > notes.md
          (cd custom_components && zip -qr ../athom_hub.zip athom_hub -x '*/__pycache__/*')
          gh release create "v$V" athom_hub.zip --title "Athom Hub $V" --notes-file notes.md --target "$GITHUB_SHA"
